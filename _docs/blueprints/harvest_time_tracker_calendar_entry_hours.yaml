blueprint:
  name: Harvest Time Tracker - Automatic entry from calendar (AI)
  description: Automatically adds an entry to a correct task, based on AI, when a calendar entry ends based on the calendar summary. Because this is using AI, it might not pick the best option. This has been tested with ChatGPT.
  domain: automation
  author: BottlecapDave
  input:
    ai_task_entity:
      name: AI task entity
      description: The AI task entity to run against
      selector:
        entity:
          filter:
          - domain:
            - ai_task
    calendar_entity:
      name: Calendar entity
      description: The entity of the calendar to monitor
      selector:
        entity:
          filter:
          - domain:
            - calendar
    hours_today_entity:
      name: Hours today entity
      description: The entity which determines which account the entry should be added to (e.g sensor.harvest_time_tracker_{ACCOUNT_ID/NAME}_hours_today)
      selector:
        entity:
          filter:
          - domain:
            - sensor
            integration: harvest_time_tracker
    tasks_entity:
      name: Tasks entity
      description: The event entity which determines tha available tasks (e.g event.harvest_time_tracker_{ACCOUNT_ID/NAME}_tasks)
      selector:
        entity:
          filter:
          - domain:
            - event
            integration: harvest_time_tracker
    default_task_entity:
      name: Default task entity
      description: The default task entity to determine the task to log the calendar entry to if a suitable one isn't picked (e.g select.harvest_time_tracker_{ACCOUNT_ID/NAME}_default_task)
      selector:
        entity:
          filter:
          - domain:
            - select
            integration: harvest_time_tracker
    additional_prompt_instructions:
      name: Additional prompt instructions
      description: Any additional instructions to provide to the prompt (e.g. favour certain tasks if given a choice)
    additional_conditions:
      name: Additional conditions
      description: |
        Extra conditions you may want to add to this automation 
        (Example: Working)
      default: []
      selector:
        condition:
    ignored_event_summaries:
      name: Ignored event summaries
      description: A list of event summaries which should be ignored (e.g. Lunch, WFH) and default to the default task
      default: []
      selector:
        text:
          multiple: true
    known_summary_tasks:
      name: Known event summaries
      description: A list of partial event summaries which are known and should be prioritised when picking a task
      default: []
      selector:
        object:
          label_field: summary
          multiple: true
          fields:
            summary:
              label: Summary
              selector:
                text:
            project_id:
              label: Harvest Project Id
              selector:
                text:
            task_id:
              label: Harvest Task Id
              selector:
                text:
trigger_variables:
  ai_task_entity: !input ai_task_entity
  calendar_entity: !input calendar_entity
  tasks_entity: !input tasks_entity
  hours_today_entity: !input hours_today_entity
  default_task_entity: !input default_task_entity
  additional_prompt_instructions: !input additional_prompt_instructions
  additional_conditions: !input additional_conditions
  ignored_event_summaries: !input ignored_event_summaries
  known_summary_tasks: !input known_summary_tasks
mode: queued
max: 4
triggers:
- trigger: calendar
  event: end
  entity_id: !input calendar_entity
conditions:
- and: !input additional_conditions
actions:
- variables:
    is_ignored: >
      {% set lower_summary = trigger.calendar_event.summary | lower %}
      {{ lower_summary in ignored_events | lower }}
    target_project: >
      {% set lower_summary = trigger.calendar_event.summary | lower %}
      {% for data in known_summary_tasks %}
        {% if data.summary | lower in lower_summary %}
          {{ data }}
        {% endif %}
      {% endfor %}
- if:
  - condition: template
    value_template: >
      {{ is_ignored }}
  then:
  - action: harvest_time_tracker.add_time_with_hours
    data:
      project_id: >
        {{ state_attr(default_task_entity, 'project_id') }}
      task_id: >
        {{ state_attr(default_task_entity, 'task_id') }}
      date: >
        {{ (trigger.calendar_event.end | as_datetime).strftime("%Y-%m-%d") }}
      hours: >
        {{ ((trigger.calendar_event.end | as_datetime | as_timestamp) - (trigger.calendar_event.start | as_datetime | as_timestamp)) / 60 / 60 }}
      notes: >
        {{ trigger.calendar_event.summary }}
    target:
      entity_id: !input hours_today_entity
  else:
  - if:
    - condition: template
      value_template: >
        {{ target_project != None and target_project != "" }}
    then:
    - action: harvest_time_tracker.add_time_with_hours
      data:
        project_id: >
          {{ target_project.project_id }}
        task_id: >
          {{ target_project.task_id }}
        date: >
          {{ (trigger.calendar_event.end | as_datetime).strftime("%Y-%m-%d") }}
        hours: >
          {{ ((trigger.calendar_event.end | as_datetime | as_timestamp) - (trigger.calendar_event.start | as_datetime | as_timestamp)) / 60 / 60 }}
        notes: >
          {{ trigger.calendar_event.summary }}
      target:
        entity_id: !input hours_today_entity
    else:
    - action: ai_task.generate_data
      response_variable: response
      data:
        task_name: Harvest Target Project
        entity_id: !input ai_task_entity
        instructions: >-
          You have the following tasks {{
          state_attr(tasks_entity, 'tasks') }}.
          Based on the text '{{ trigger.calendar_event.summary }}' pick the best task based on
          client_name and project_name. Only the selected task should be returned.
          Nothing else. If none of the example text can be found in the client_name or
          project_name then is_found should return false.{{ additional_prompt_instructions }}
        structure:
          is_found:
            selector:
              boolean:
          project_id:
            selector:
              text:
          id:
            selector: 
              text:
    - if:
      - condition: template
        value_template: >
          {{ response.data.is_found }}
      then:
      - action: harvest_time_tracker.add_time_with_hours
        data:
          project_id: >
            {{ response.data.project_id | int }}
          task_id: >
            {{ response.data.id | int }}
          date: >
            {{ (trigger.calendar_event.end | as_datetime).strftime("%Y-%m-%d") }}
          hours: >
            {{ ((trigger.calendar_event.end | as_datetime | as_timestamp) - (trigger.calendar_event.start | as_datetime | as_timestamp)) / 60 / 60 }}
          notes: >
            {{ trigger.calendar_event.summary }}
        target:
          entity_id: !input hours_today_entity
      else:
      - action: harvest_time_tracker.add_time_with_hours
        data:
          project_id: >
            {{ state_attr(default_task_entity, 'project_id') }}
          task_id: >
            {{ state_attr(default_task_entity, 'task_id') }}
          date: >
            {{ (trigger.calendar_event.end | as_datetime).strftime("%Y-%m-%d") }}
          hours: >
            {{ ((trigger.calendar_event.end | as_datetime | as_timestamp) - (trigger.calendar_event.start | as_datetime | as_timestamp)) / 60 / 60 }}
          notes: >
            {{ trigger.calendar_event.summary }}
        target:
          entity_id: !input hours_today_entity